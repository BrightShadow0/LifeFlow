name: LifeFlow safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-storage-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser scripts
        run: |
          node --check Updated/script.js
          node --check Updated/recovery.js
          node --check Updated/auth.js
          node --check Updated/tasks.js
          node --check Updated/notes.js
          node --check Updated/theme.js
          node --check Updated/ui.js
          node --check Updated/cloud-backup.js
          node --check Updated/cloud-sync.js
          node --check Updated/calendar-events.js
          node --check Updated/supabase-auth.js
          node --check Updated/live-calendar.js
          node --check Updated/calendar-notifications.js
          node --check service-worker.js
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: deno check --no-lock supabase/functions/calendar-invites/index.ts supabase/functions/notify-calendar-guests/index.ts supabase/functions/dispatch-calendar-reminders/index.ts
      - name: Check ES modules
        run: |
          node --input-type=module --check < Updated/state.js
          node --input-type=module --check < Updated/migrations.js
      - name: Verify storage and asset contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("Updated/workspace.html").read_text()
          state = Path("Updated/state.js").read_text()
          script = Path("Updated/script.js").read_text()
          recovery = Path("Updated/recovery.js").read_text()
          assert html.index('recovery.js?') < html.index('script.js?'), "Recovery module must load before workspace bootstrap"
          assert "lifeflow2_state_" in state, "Existing account-scoped storage contract must remain"
          assert "lifeflow2_users" in script, "Existing profile storage contract must remain"
          assert "globalThis.LifeFlowRecovery" in state, "StateManager must call the recovery layer"
          assert "before-archive-restore" in script, "Archive restore must create a safety checkpoint"
          assert "MAX_SNAPSHOTS_PER_USER" in recovery, "Recovery retention limit must remain enabled"
          assert "clearAll" in recovery, "Explicit reset must be able to clear the recovery vault"
          assert "clearUser" in recovery, "Account deletion must remove that account's recovery points"
          backup = Path("Updated/cloud-backup.js").read_text()
          assert "AES-GCM" in backup and "PBKDF2" in backup, "Cloud backups must use authenticated client-side encryption"
          assert "deleteBackup" in backup and "listBackups" in backup, "Cloud backup history must support listing and deletion"
          assert "data-cloud-delete" in html and "data-cloud-restore" in html, "Cloud backup UI must expose management and restore"
          assert "before-cloud-restore" in html and "checkpoint?.saved" in html, "Restore must require a successful local recovery checkpoint"
          assert "Cloud account:" in html, "Backup history must identify its owning cloud account"
          sync = Path("Updated/cloud-sync.js").read_text()
          migration = Path("supabase/migrations/20261108000200_encrypted_workspace_sync.sql").read_text()
          assert "AES-GCM" in sync and "PBKDF2" in sync, "Cloud workspace sync must encrypt in the browser"
          assert "encrypted_workspace_sync" in sync and "revision" in sync, "Cloud sync must use a revisioned remote record"
          assert "enable row level security" in migration.lower(), "Cloud sync table must enable RLS"
          assert '"Users can read their encrypted workspace"' in migration, "Cloud sync table must scope reads to owner"
          assert '"Users can update their encrypted workspace"' in migration, "Cloud sync table must scope updates to owner"
          assert "events" in sync and "calendar" not in sync.lower() or "events" in sync, "Workspace sync must preserve event collections"
          print("Calendar events and workspace sync contracts verified.")
          print("Release 11 encrypted workspace sync contracts verified.")
          print("Release 9 encrypted backup management and restore contracts verified.")
          print("LifeFlow storage and recovery contracts verified.")
          PY
      - name: Verify migrations preserve existing workspace content
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { migrateWorkspaceState } from "./Updated/migrations.js";
          const original = { currentUser: "person@example.com", tasks: [{ id: 7, title: "Keep me" }], customField: { preserved: true } };
          const result = migrateWorkspaceState(original, { currentUser: "person@example.com", defaults: { tasks: [], notes: [], codeNotes: [], folders: [], noteLinks: [] } });
          assert.deepEqual(result.state.tasks, original.tasks);
          assert.deepEqual(result.state.customField, original.customField);
          assert.equal(result.state.__lifeFlowSchemaVersion, 2);
          assert.deepEqual(result.state.events, []);
          assert.equal(result.migrated, true);
          console.log("Migration preserves existing content and adds schema metadata only.");
          JS

      - name: Test calendar events, travel reminders and iCalendar export
        run: node --test tests/calendar-events.test.cjs
      - name: Test live calendar and notification security contracts
        run: node --test tests/live-calendar-reminders.test.cjs
      - name: Test encrypted cloud backup engine
        run: node --test tests/cloud-backup.test.cjs
      - name: Test cloud authentication and MFA flows
        run: node --test tests/supabase-auth.test.cjs
      - name: Test encrypted multi-device workspace sync
        run: node --test tests/cloud-sync.test.cjs
      - name: Test cloud authentication and MFA
        run: node --test tests/supabase-auth.test.cjs
